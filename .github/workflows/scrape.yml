name: Run Cornwall scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: cornwall-scrape-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      UPRN: ${{ secrets.UPRN }}
      POSTCODE: ${{ secrets.POSTCODE }}
      HOUSE_NUMBER_OR_NAME: ${{ secrets.HOUSE_NUMBER_OR_NAME }}
      STRICT_POSTCODE_MATCH: ${{ secrets.STRICT_POSTCODE_MATCH }}
      INCLUDE_FOOD: ${{ secrets.INCLUDE_FOOD }}
      INCLUDE_RECYCLING: ${{ secrets.INCLUDE_RECYCLING }}
      INCLUDE_RUBBISH: ${{ secrets.INCLUDE_RUBBISH }}
      INCLUDE_GARDEN: ${{ secrets.INCLUDE_GARDEN }}
      ENABLE_COLLECTIONS: ${{ secrets.ENABLE_COLLECTIONS }}
      DISABLE_COLLECTIONS: ${{ secrets.DISABLE_COLLECTIONS }}
      FAIL_ON_EMPTY: ${{ secrets.FAIL_ON_EMPTY }}
      OUTPUT_FILENAME: ${{ secrets.OUTPUT_FILENAME }}
      TITLE: ${{ secrets.TITLE }}
      DESCRIPTION: ${{ secrets.DESCRIPTION }}
      URL: ${{ secrets.URL }}
      USER_AGENT: ${{ secrets.USER_AGENT }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      REQUEST_TIMEOUT: ${{ secrets.REQUEST_TIMEOUT }}
      REQUEST_MAX_RETRIES: ${{ secrets.REQUEST_MAX_RETRIES }}
      REQUEST_RETRY_BACKOFF: ${{ secrets.REQUEST_RETRY_BACKOFF }}
      ENABLE_HTTP_CACHE: ${{ secrets.ENABLE_HTTP_CACHE }}
      HTTP_CACHE_FILE: ${{ secrets.HTTP_CACHE_FILE }}
      SCRAPER_RUN_ATTEMPTS: ${{ secrets.SCRAPER_RUN_ATTEMPTS }}
      CREATE_FAILURE_ISSUE: ${{ secrets.CREATE_FAILURE_ISSUE || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run scraper (with retries)
        run: |
          ATTEMPTS="${SCRAPER_RUN_ATTEMPTS:-2}"
          if [ "$ATTEMPTS" -lt 1 ]; then
            ATTEMPTS=1
          fi

          attempt=1
          while [ "$attempt" -le "$ATTEMPTS" ]; do
            echo "Scraper attempt $attempt/$ATTEMPTS"
            if python cornwall_collection.py; then
              echo "Scraper completed successfully"
              exit 0
            fi

            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              sleep_seconds=$((attempt * 20))
              echo "Attempt $attempt failed; retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
            attempt=$((attempt + 1))
          done

          echo "All scraper attempts failed"
          exit 1
      - name: Commit updated calendar
        run: |
          OUTPUT_FILE="${OUTPUT_FILENAME:-cornwall_collection.ics}"
          CACHE_FILE="${HTTP_CACHE_FILE:-.http_cache.json}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f "$CACHE_FILE" ]; then
            git add "$CACHE_FILE"
          fi
          if [ -f "$OUTPUT_FILE" ]; then
            git add "$OUTPUT_FILE"
          fi
          if git diff --cached --quiet --exit-code; then
            echo "No changes to commit"
          else
            git commit -m "Update waste collection calendar"
            git push
          fi
      - name: Create or update failure issue
        if: failure() && env.CREATE_FAILURE_ISSUE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "Automated scraper failure";
            const labels = ["automation", "scraper-failure"];
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled/manual scraper workflow failed.",
              "",
              `- Workflow: ${context.workflow}`,
              `- Job: ${context.job}`,
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              "",
              "Please review the run logs and fix the scraping/configuration issue."
            ].join("\\n");

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: labels.join(","),
              per_page: 100
            });

            const issue = existing.data.find((item) => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels
              });
            }
